# При изменении ветки preview перезапускает публикацию,
# чтобы обновился предпросмотр по адресу /preview/.
name: Обновить предпросмотр

on:
  push:
    branches: [preview]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ github.token }}
