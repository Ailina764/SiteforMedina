# Собирает сайт и публикует его на GitHub Pages.
# /preview/ — самая свежая версия из ветки (с меткой «ПРЕДПРОСМОТР»).
# Основной сайт — одобренная версия: коммит, записанный в .github/published-commit.
# Чтобы опубликовать предпросмотр, впиши в этот файл новый коммит.
name: Публикация на GitHub Pages

on:
  push:
    branches: [claude/claude-code-vs-regular-zuuvum, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: preview
      - name: Какая версия опубликована
        id: published
        run: echo "sha=$(tr -d '[:space:]' < preview/.github/published-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.published.outputs.sha }}
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Основной сайт
        working-directory: site
        run: npm ci && npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - name: Предпросмотр
        working-directory: preview
        run: npm ci && npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/preview
          NEXT_PUBLIC_PREVIEW: '1'
      - name: Собрать всё в одну папку
        run: |
          mkdir dist
          cp -r site/out/. dist/
          cp -r preview/out dist/preview
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
