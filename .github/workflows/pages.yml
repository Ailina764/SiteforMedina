# Собирает сайт и публикует его на GitHub Pages.
# Основной сайт берётся из ветки по умолчанию, предпросмотр — из ветки preview
# и публикуется по адресу /preview/.
name: Публикация на GitHub Pages

on:
  push:
    branches: [claude/claude-code-vs-regular-zuuvum, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: site
      - name: Есть ли ветка preview
        id: preview
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" preview >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.preview.outputs.exists == 'true'
        with:
          ref: preview
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Основной сайт
        working-directory: site
        run: npm ci && npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - name: Предпросмотр
        if: steps.preview.outputs.exists == 'true'
        working-directory: preview
        run: npm ci && npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/preview
          NEXT_PUBLIC_PREVIEW: '1'
      - name: Собрать всё в одну папку
        run: |
          mkdir dist
          cp -r site/out/. dist/
          if [ -d preview/out ]; then cp -r preview/out dist/preview; fi
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
